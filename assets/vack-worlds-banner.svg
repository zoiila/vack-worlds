<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">VWorld — World Management for Minigames</title>
  <desc id="desc">A Vack Studio banner for VWorld with three connected isometric Minecraft-inspired world platforms representing a template and independent arenas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B171B"/><stop offset=".55" stop-color="#14282D"/><stop offset="1" stop-color="#0A1418"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1A3539"/><stop offset="1" stop-color="#102227"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E6C88A"/><stop offset="1" stop-color="#7DD3C7"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#395A53"/><stop offset="1" stop-color="#263E3C"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#213B39"/><stop offset="1" stop-color="#102427"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#81B7B1" stroke-opacity=".075"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1440" height="480" fill="#091316"/>
  <rect x="20" y="20" width="1400" height="440" rx="28" fill="url(#bg)" stroke="#3C5E5E" stroke-width="2"/>
  <rect x="21" y="21" width="1398" height="438" rx="27" fill="url(#grid)"/>
  <path d="M50 400H1390M50 401H1390" stroke="#739A95" stroke-opacity=".14"/>
  <path d="M763 20V460" stroke="#739A95" stroke-opacity=".13"/>
  <circle cx="1089" cy="214" r="155" fill="#7DD3C7" opacity=".09" filter="url(#glow)"/>
  <path d="M67 72h7v30h-7z" fill="#E6C88A"/>
  <text x="96" y="94" fill="#E6C88A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4">VACK STUDIO  /  SERVER SYSTEMS</text>
  <text x="68" y="204" fill="#F4F0E8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="750" letter-spacing="-3">VWorld</text>
  <rect x="70" y="228" width="74" height="5" rx="2" fill="#E6C88A"/>
  <rect x="154" y="228" width="32" height="5" rx="2" fill="#7DD3C7"/>
  <text x="69" y="282" fill="#D3DDD9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26">One template. Infinite arenas.</text>
  <text x="69" y="322" fill="#ADB5BD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Create  /  Configure  /  Fork  /  Reset</text>
